name: Final sync of latest upstream fixes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply translated upstream deltas
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def patch_file(path, replacements):
              p = Path(path)
              if not p.exists():
                  print(f'SKIP missing: {path}')
                  return
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  print(f'UPDATED: {path}')
              else:
                  print(f'NO CHANGE: {path}')

          patch_file('Day01-20/06.Loop-Structures.md', [
              ('4 feet 5 inches = 165.74 cm', '5 feet 4 inches = 162.56 cm'),
              ('4 ft 5 in = 165.74 cm', '5 ft 4 in = 162.56 cm'),
              ('4 feet 5 inches = 165.74 centimeters', '5 feet 4 inches = 162.56 centimeters'),
          ])

          p = Path('Day01-20/16.Advanced-Function-Usage.md')
          if p.exists():
              text = p.read_text(encoding='utf-8')
              marker = "As you can see from the code above, the keyword for defining a lambda function is `lambda`, followed by the function's parameters"
              sentence = "Lambda functions are essentially anonymous functions. Next, let's see how to use lambda functions.\n\n"
              if sentence.strip() not in text and marker in text:
                  p.write_text(text.replace(marker, sentence + marker, 1), encoding='utf-8')
                  print(f'UPDATED: {p}')

          replacements = [
              ('from json import dump', 'import json'),
              ('dump(my_dict, file, ensure_ascii=False)', 'json.dump(my_dict, file, ensure_ascii=False)'),
              ('executor.submit(fn, *args)', 'executor.submit(fn, args)'),
              ("content = soup.body.find('div', attrs={'id': 'mw-content-text'})", "content = soup.body.find('div', attrs={'class': 'mw-content-ltr'})"),
              ('t1 = Thread(target=output(content))', 't1 = Thread(target=output, args=(content, ))'),
              ('t2 = Thread(target=count(content))', 't2 = Thread(target=count, args=(content, ))'),
              ('webdriver.Chrome(chrome_options=options)', 'webdriver.Chrome(options=options)'),
              ("resp = requests.get(url)\nunknown_charset_data = resp.content", "resp = requests.get(url)\nhtml = resp.content.decode('utf-8')\nsoup = bs4.BeautifulSoup(html, 'lxml')\nprint(soup.body)"),
              ('html = bs4.UnicodeDammit(unknown_charset_data).unicode_markup\n', ''),
              ("Python's 100-Day Growth Plan - From Novice to Master", 'Python 100-Day Growth Plan - From Novice to Master'),
          ]
          for p in Path('.').rglob('*.md'):
              if '.git' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if p == Path('README.md'):
                  text = text.replace('\n>![', '\n> ![')
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  print(f'UPDATED: {p}')

          for p in Path('.').rglob('README*.md'):
              text = p.read_text(encoding='utf-8')
              original = text
              text = text.replace('RAP', 'RPV').replace('FIANANCE', 'FINANCE').replace('EBTIDA', 'EBITDA')
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  print(f'UPDATED: {p}')
          PY

          # Temporary migration/sync workflows are no longer needed.
          rm -f .github/workflows/inspect-upstream-delta.yml
          rm -f .github/workflows/final-sync.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: apply latest upstream fixes to English edition" || exit 0
          git push
