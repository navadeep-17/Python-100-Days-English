name: Restore README acronyms

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore intended README text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('CRPVS Gambling Game', 'CRAPS Gambling Game')
          text = text.replace('[RPV2](http://rap2.taobao.org/)', '[RAP2](http://rap2.taobao.org/)')
          p.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore intended README acronyms"
          git push
