name: Inspect upstream delta

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Show changes since English translation base
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/jackfrued/Python-100-Days.git source
          cd source
          BASE=8e74dd4d652a0ff8b2a66afd8beed5e4ca6739f5
          HEAD=44b2575bf42a02d0a38d9dada3f60335c95c5ec2
          echo '=== NAME STATUS ==='
          git diff --name-status "$BASE" "$HEAD"
          echo '=== TEXT DIFF START ==='
          git diff --unified=3 "$BASE" "$HEAD" -- '*.md' '*.py' '*.html' '*.txt' '*.json' '*.yml' '*.yaml' '*.toml' '*.ini' '*.cfg'
          echo '=== TEXT DIFF END ==='
